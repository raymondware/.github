name: Feature request
description: Suggest an improvement grounded in a user problem
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What task is difficult or impossible today, and who experiences it?
      placeholder: Describe the problem before the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would a successful user experience look like?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Share an implementation idea if you have one. This section is optional.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or other approaches you evaluated.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and pull requests for similar requests.
          required: true
        - label: I described the user problem, not only a preferred implementation.
          required: true
